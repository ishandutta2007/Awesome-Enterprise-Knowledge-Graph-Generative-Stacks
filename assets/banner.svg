<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .node-pulse-1 {
        animation: pulseSlow 4s infinite ease-in-out;
      }
      .node-pulse-2 {
        animation: pulseSlow 3.2s infinite ease-in-out reverse;
      }
      .node-pulse-3 {
        animation: pulseSlow 2.7s infinite ease-in-out;
      }
      .flow-edge {
        stroke-dasharray: 8 6;
        animation: dashFlow 20s linear infinite;
      }
      .flow-edge-reverse {
        stroke-dasharray: 6 6;
        animation: dashFlowRev 25s linear infinite;
      }
      @keyframes pulseSlow {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashFlowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/>

  <!-- Ambient Glow Spots (Background layer) -->
  <circle cx="200" cy="180" r="180" fill="url(#glowCyan)"/>
  <circle cx="1020" cy="160" r="190" fill="url(#glowPurple)"/>

  <!-- Subtle Graph Network Background Layer (Low opacity, non-intrusive) -->
  <g opacity="0.38">
    <!-- Graph Edges -->
    <line x1="80" y1="70" x2="220" y2="120" stroke="#38bdf8" stroke-width="1.5" class="flow-edge"/>
    <line x1="220" y1="120" x2="160" y2="280" stroke="#818cf8" stroke-width="1.5" class="flow-edge-reverse"/>
    <line x1="220" y1="120" x2="340" y2="80" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="160" y1="280" x2="320" y2="300" stroke="#38bdf8" stroke-width="1.5" class="flow-edge"/>
    <line x1="340" y1="80" x2="440" y2="150" stroke="#60a5fa" stroke-width="1.5"/>
    
    <line x1="880" y1="90" x2="980" y2="140" stroke="#818cf8" stroke-width="1.5" class="flow-edge"/>
    <line x1="980" y1="140" x2="1120" y2="90" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="980" y1="140" x2="920" y2="260" stroke="#38bdf8" stroke-width="1.5" class="flow-edge-reverse"/>
    <line x1="920" y1="260" x2="1080" y2="280" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="1080" y1="280" x2="1140" y2="200" stroke="#f472b6" stroke-width="1.5" class="flow-edge"/>

    <!-- Left Side Graph Nodes -->
    <circle cx="80" cy="70" r="8" fill="#38bdf8" class="node-pulse-1" filter="url(#glowFilter)"/>
    <circle cx="220" cy="120" r="12" fill="#818cf8" class="node-pulse-2" filter="url(#glowFilter)"/>
    <circle cx="160" cy="280" r="10" fill="#a78bfa" class="node-pulse-3" filter="url(#glowFilter)"/>
    <circle cx="340" cy="80" r="9" fill="#06b6d4" class="node-pulse-1" filter="url(#glowFilter)"/>
    <circle cx="320" cy="300" r="7" fill="#60a5fa" class="node-pulse-2" filter="url(#glowFilter)"/>
    <circle cx="440" cy="150" r="6" fill="#818cf8" class="node-pulse-3"/>

    <!-- Right Side Graph Nodes -->
    <circle cx="880" cy="90" r="9" fill="#a855f7" class="node-pulse-2" filter="url(#glowFilter)"/>
    <circle cx="980" cy="140" r="14" fill="#6366f1" class="node-pulse-1" filter="url(#glowFilter)"/>
    <circle cx="1120" cy="90" r="8" fill="#ec4899" class="node-pulse-3" filter="url(#glowFilter)"/>
    <circle cx="920" cy="260" r="11" fill="#38bdf8" class="node-pulse-2" filter="url(#glowFilter)"/>
    <circle cx="1080" cy="280" r="9" fill="#a855f7" class="node-pulse-1" filter="url(#glowFilter)"/>
    <circle cx="1140" cy="200" r="7" fill="#f43f5e" class="node-pulse-3"/>
  </g>

  <!-- Central Foreground Content Card (Ensures text is 100% readable and never obscured) -->
  <rect x="230" y="55" width="740" height="250" rx="20" fill="#0b1120" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" backdrop-filter="blur(10px)"/>

  <!-- Category Pill Badge -->
  <g transform="translate(420, 80)">
    <rect width="360" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#38bdf8" class="node-pulse-1"/>
    <text x="35" y="21" class="badge-text">GRAPH DATABASES • GRAPHRAG • SEMANTICS</text>
  </g>

  <!-- Foreground Title -->
  <text x="600" y="170" text-anchor="middle" class="text-title" font-size="36">
    Awesome Enterprise Knowledge Graph
  </text>
  <text x="600" y="215" text-anchor="middle" class="text-title" font-size="34" fill="#38bdf8">
    Generative Stacks
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="265" text-anchor="middle" class="text-subtitle" font-size="16">
    Curated Hub for Enterprise Knowledge Graphs, Hybrid GraphRAG &amp; Semantic Data Evolution
  </text>
</svg>
